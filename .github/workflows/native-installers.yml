name: Build and exercise native desktop installers
on:
  workflow_dispatch:
    inputs:
      target:
        description: Native installer target
        type: choice
        options: [all, win-x64, darwin-arm64, darwin-x64]
        default: all
permissions:
  contents: write
jobs:
  installers:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.target == 'win-x64' && '[{"os":"windows-latest","target":"win-x64"}]' || inputs.target == 'darwin-arm64' && '[{"os":"macos-15","target":"darwin-arm64"}]' || inputs.target == 'darwin-x64' && '[{"os":"macos-15-intel","target":"darwin-x64"}]' || '[{"os":"windows-latest","target":"win-x64"},{"os":"macos-15","target":"darwin-arm64"},{"os":"macos-15-intel","target":"darwin-x64"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the public free companion payload
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installer-payload"
          gh release download v0.3.0-rc.4 --repo "$GITHUB_REPOSITORY" --pattern "codex-project-chat-sort-${{ matrix.target }}.zip" --dir "$RUNNER_TEMP/installer-payload"
      - name: Prepare the Windows installer compiler
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Compile the final native installer
        shell: bash
        run: python3 installers/build.py --target "${{ matrix.target }}" --zip "$RUNNER_TEMP/installer-payload/codex-project-chat-sort-${{ matrix.target }}.zip" --out dist
      - name: Capture the Windows installer window
        if: runner.os == 'Windows'
        shell: powershell
        run: ./installers/cloud-windows.ps1 -PreviewOnly
      - name: Capture the Mac installer window
        if: runner.os == 'macOS'
        shell: bash
        run: node installers/cloud-preview.mjs
      - name: Prepare the official Windows client
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Install-PackageProvider -Name NuGet -Force | Out-Null
          Install-Module -Name Microsoft.WinGet.Client -Scope CurrentUser -Repository PSGallery -Force | Out-Null
          Import-Module Microsoft.WinGet.Client
          Repair-WinGetPackageManager -AllUsers
          winget install --id 9PLM9XGG6VKS --exact --source msstore --silent --accept-package-agreements --accept-source-agreements --disable-interactivity
          if($LASTEXITCODE -ne 0){throw 'Official Codex installation failed.'}
          Get-AppxPackage -Name OpenAI.Codex | Select-Object Name,Version,Publisher,SignatureKind | ConvertTo-Json | Set-Content dist/official-client.json -Encoding UTF8
      - name: Prepare the official Mac client
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 300 https://persistent.oaistatic.com/codex-app-prod/Codex.dmg -o "$RUNNER_TEMP/Codex.dmg"
          mkdir -p "$RUNNER_TEMP/official-codex"
          hdiutil attach "$RUNNER_TEMP/Codex.dmg" -nobrowse -readonly -mountpoint "$RUNNER_TEMP/official-codex"
          python3 - <<'PY'
          import json, os, pathlib, plistlib, subprocess
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'official-codex'
          apps = list(source.glob('*.app'))
          if len(apps) != 1:
              raise RuntimeError('Expected one official desktop app in the disk image.')
          app = pathlib.Path('/Applications') / apps[0].name
          subprocess.run(['/usr/bin/ditto', str(apps[0]), str(app)], check=True)
          subprocess.run(['/usr/bin/codesign', '--verify', '--deep', '--strict', str(app)], check=True)
          signed = subprocess.run(['/usr/bin/codesign', '-dv', '--verbose=4', str(app)], capture_output=True, text=True, check=True)
          pathlib.Path('dist/official-client-signature.txt').write_text(signed.stderr)
          if 'TeamIdentifier=2DC432GLL2' not in signed.stderr:
              raise RuntimeError('Unexpected desktop signing team.')
          with (app / 'Contents/Info.plist').open('rb') as file:
              info = plistlib.load(file)
          pathlib.Path('dist/official-client.json').write_text(json.dumps({'app':str(app), 'version':info.get('CFBundleShortVersionString')}))
          PY
          hdiutil detach "$RUNNER_TEMP/official-codex"
      - name: Exercise the final Windows install, upgrade and uninstall
        if: runner.os == 'Windows'
        shell: powershell
        run: ./installers/cloud-windows.ps1
      - name: Exercise the final Mac GUI install, upgrade and uninstall
        if: runner.os == 'macOS'
        shell: bash
        run: node installers/cloud-mac.mjs
      - name: Publish installers with passed lifecycle receipts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            gh release upload v0.3.0-rc.4 dist/Codex-Sidebar-Sort-Windows-x64-Setup.exe dist/win-x64-installer.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release upload v0.3.0-rc.4 dist/Codex-Sidebar-Sort-Mac-*.dmg "dist/${{ matrix.target }}-installer.json" --repo "$GITHUB_REPOSITORY" --clobber
          fi
      - name: Retain native screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-evidence-${{ matrix.target }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            dist/evidence/
            dist/*-installer.json
            dist/official-client*
