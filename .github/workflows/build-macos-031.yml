name: Assemble macOS 0.3.1 installers
on:
  push:
    branches: [codex/macos-0.3.1-build]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the published portable payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p payload
          gh release download v0.3.1 --pattern "codex-project-chat-sort-${{ matrix.target }}.zip" --pattern desktop-packages.json --dir payload
      - name: Build the native disk image
        run: |
          python3 installers/build.py --target "${{ matrix.target }}" --zip "payload/codex-project-chat-sort-${{ matrix.target }}.zip" --manifest payload/desktop-packages.json --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-0.3.1-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*-installer.json
          if-no-files-found: error
          retention-days: 3
